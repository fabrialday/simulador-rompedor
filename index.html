<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de rompedor de rocas · Chancado primario · v0.6</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#1a1d21;
  --plate:#cfd3d7;      /* frontal del mando */
  --plate-ink:#1d2024;
  --rubber:#16181b;
  --amber:#f2b705;
  --ok:#2fbf71;
  --bad:#e5383b;
  --warn:#ff9f1c;
  --muted:#8c949c;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121417; } }
:root[data-theme="dark"]{ --bg:#121417; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#f2f3f4;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
*{box-sizing:border-box}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- barra superior / paneles ---------- */
.tbtn{border:0;background:var(--plate);color:var(--plate-ink);font:600 14px/1 var(--font);padding:10px 13px;border-radius:8px;cursor:pointer;min-height:36px;white-space:nowrap}
.tbtn:focus-visible,.seg button:focus-visible,.pbtn:focus-visible,.mbtn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.seg{display:flex;background:#b3b8bd;border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--plate-ink);font:600 14px/1 var(--font);padding:10px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--rubber);color:var(--amber)}
#cfgWrap{position:absolute;left:10px;top:10px;z-index:5}
#cfgMenu{display:none;flex-direction:column;gap:6px;margin-top:6px;background:var(--plate);border:4px solid var(--rubber);border-radius:10px;padding:8px;min-width:230px}
.mlabel{font:700 11px/1 var(--font);color:#4b5259;text-transform:uppercase;letter-spacing:.5px;color:#4b5259}
.mbtn{border:0;background:#e3e6e9;color:var(--plate-ink);font:600 14px/1 var(--font);padding:11px 12px;border-radius:6px;cursor:pointer;text-align:left;min-height:40px}

#topc{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 520px)}
#stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:4px 9px;min-width:60px;text-align:center}
.chip b{display:block;font:700 16px/1.15 var(--font);font-variant-numeric:tabular-nums}
.chip i{display:block;font:normal 11px/1.2 var(--font);color:#4b5259}
.chip[data-s="ready"] b{color:#0d7a43}
.chip[data-s="estop"] b{color:#c1121f}
.chip[data-s="nosignal"] b{color:#c25e00;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#hint{background:rgba(18,20,23,.88);border-bottom:4px solid var(--amber);padding:9px 14px;border-radius:6px;font-size:14.5px;line-height:1.35;max-width:680px;text-align:center}
#banner{display:none;background:var(--bad);color:#fff;font-weight:700;padding:9px 14px;border-radius:6px;font-size:14.5px;max-width:680px;text-align:center}
#banner.warn{background:var(--warn);color:#1d1400;animation:blink .7s steps(2) infinite}

#rcol{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;width:max-content}
#rcol .tbtn{width:100%}
#gauges{display:flex;gap:6px;background:rgba(18,20,23,.74);border-radius:8px;padding:8px}
.g{display:flex;flex-direction:column;align-items:center;gap:6px;width:46px}
.g .bar{position:relative;width:14px;height:clamp(96px,24vh,190px);border-radius:7px;background:linear-gradient(to top,rgba(229,56,59,.75) 0 5%,#3a4047 5% 95%,rgba(229,56,59,.75) 95% 100%)}
.g .bar u{position:absolute;left:-5px;right:-5px;height:7px;margin-bottom:-3.5px;bottom:50%;background:var(--amber);border-radius:3px;text-decoration:none}
.g.lim .bar u{background:#fff}
.g span{font-size:10.5px;color:#d3d8dc;text-align:center;line-height:1.1}

#thumbs{position:absolute;left:10px;top:38%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
.thumb{position:relative;width:clamp(116px,16.5vw,196px);height:clamp(77px,11vw,131px);border:2px solid rgba(242,183,5,.85);border-radius:6px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.55);overflow:hidden;background:transparent}
.thumb:hover{border-color:#fff}
.thumb .tlabel{position:absolute;left:4px;bottom:3px;font:600 10px/1 var(--font);color:#fff;text-shadow:0 1px 2px #000;background:rgba(0,0,0,.4);padding:1px 4px;border-radius:3px;pointer-events:none}
.thumb .trec{position:absolute;right:4px;top:3px;font:700 9px/1 var(--font);color:#ff5a4d;text-shadow:0 1px 2px #000;pointer-events:none}
@media (max-width:760px){ #thumbs{display:none} }
#start:disabled{opacity:.4;cursor:not-allowed}
#toasts{position:absolute;left:0;right:0;top:44%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(18,20,23,.9);border-left:5px solid var(--amber);padding:7px 12px;border-radius:4px;font-size:14px;font-weight:600;max-width:88%}
.toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)} .toast.warn{border-color:var(--warn)}
#flash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none;transition:opacity .35s}

/* ---------- mando ---------- */
#controls{position:absolute;left:0;right:0;bottom:8px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px;gap:6px;pointer-events:none}
#controls>*{pointer-events:auto}
.pad{display:flex;flex-direction:column;align-items:center;gap:3px}
.pad small{font-size:11px;color:#eef0f2;background:rgba(18,20,23,.75);padding:2px 7px;border-radius:4px;text-align:center;line-height:1.2}
.joy{width:min(29vw,132px);height:min(29vw,132px);border-radius:50%;background:var(--plate);border:5px solid var(--rubber);position:relative;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.joy .knob{position:absolute;left:50%;top:50%;width:52%;height:52%;margin:-26% 0 0 -26%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#f4f4f4 0 14%,#3b3f44 15% 100%);border:3px solid var(--rubber)}
#mid{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;max-width:190px;margin:0 auto}
.pbtn{border:0;cursor:pointer;font:700 14px/1 var(--font);touch-action:none}
#hammer{width:100%;min-height:56px;border-radius:12px;background:var(--amber);color:#1b1500;border:4px solid var(--rubber);letter-spacing:.2px}
#hammer.on{background:#ffd95a;transform:translateY(2px)}
.row2{display:flex;gap:10px;align-items:center;justify-content:center}
#start{width:56px;height:56px;border-radius:50%;background:var(--plate);color:var(--plate-ink);border:5px solid var(--rubber);font-size:11px}
#estop{width:66px;height:66px;border-radius:50%;background:#e02a1f;color:#fff;border:6px solid var(--amber);font-size:11px;box-shadow:0 3px 0 #7b120c}
#estop.on{box-shadow:none;transform:translateY(3px);background:#a01c14}

/* ---------- capas ---------- */
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,14,.78);padding:12px}
.card{background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:16px;max-width:520px;width:100%;max-height:92%;overflow:auto;touch-action:pan-y;font-size:14px;line-height:1.45;border:6px solid var(--rubber)}
.card h2{margin:0 0 6px;font-size:19px}
.card h3{margin:14px 0 4px;font-size:14px}
.card p{margin:6px 0}
.card table{border-collapse:collapse;width:100%;font-size:13px}
.card td,.card th{padding:4px 6px;border-bottom:1px solid #aeb4ba;text-align:left;vertical-align:top}
.card .big{font:800 34px/1 var(--font);margin:4px 0}
.card .pass{color:#0d7a43}.card .fail{color:#c1121f}
.card pre{margin:6px 0;font:12px/1.4 ui-monospace,Consolas,monospace;background:#e6e9ec;padding:8px;border-radius:6px;max-height:130px;overflow:auto;white-space:pre-wrap}
.card .small{font-size:12px;color:#4b5259}
.cta{margin-top:12px;border:0;background:var(--rubber);color:var(--amber);font:700 15px/1 var(--font);padding:12px 16px;border-radius:8px;cursor:pointer;min-height:44px}
.cta.alt{background:transparent;color:var(--plate-ink);border:2px solid var(--rubber)}
/* tarjeta de inicio (logo + elección de modo) */
.card.start{background:#1f2328;color:#fff;border:0;border-bottom:6px solid var(--amber);border-radius:18px;max-width:460px;padding:24px 20px;text-align:center}
.card.start .logo{width:min(280px,80%);margin:0 auto 14px;border-radius:12px;overflow:hidden;line-height:0;background:#fff}
.card.start .logo img{width:100%;height:auto;display:block}
.card.start h2{margin:0 0 4px;font-size:22px;line-height:1.2;color:#fff}
.card.start .sub{margin-bottom:10px;font-size:15px;font-weight:600;color:var(--amber)}
.card.start p{color:#c9ced6;font-size:14px}
.card.start .row{display:flex;gap:12px;margin-top:6px}
.card.start .cta{flex:1;margin-top:8px;background:var(--amber);color:#1f2328;border:2px solid var(--amber)}
.card.start .cta.alt{background:transparent;color:var(--amber)}
@media (max-width:1000px){
  #topc{left:8px;transform:none;top:54px;align-items:flex-start;max-width:calc(100% - 215px)}
  #stats{justify-content:flex-start}
  #hint,#banner{text-align:left;max-width:100%}
  #rcol{top:54px}
  .g{width:38px}.g span{font-size:9px}
}
@media (max-width:600px){
  .chip{min-width:0;padding:3px 6px}.chip b{font-size:13px}.chip i{font-size:9.5px}
  #hint,#banner{font-size:12.5px;padding:7px 9px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="cfgWrap">
    <button class="tbtn" id="cfgBtn" aria-expanded="false" aria-haspopup="true">⚙ Configuración</button>
    <div id="cfgMenu">
      <div class="mlabel">Modo</div>
      <div class="seg" id="modeSeg">
        <button data-m="train" class="on">Formación</button>
        <button data-m="eval">Evaluación</button>
      </div>
      <button class="mbtn" id="vrBtn">Entrar en VR</button>
      <button class="mbtn" id="sndBtn">Sonido: sí</button>
      <button class="mbtn" id="joyBtn">Joysticks en pantalla: visibles</button>
      <button class="mbtn" id="helpBtn">? Ayuda y controles</button>
    </div>
  </div>

  <div id="topc">
    <div id="stats">
      <div class="chip"><b id="sMode">Formación</b><i>Modo</i></div>
      <div class="chip" id="cState" data-s="off"><b id="sState">APAGADO</b><i>Estado</i></div>
      <div class="chip"><b id="sTime">0:00</b><i id="sTimeL">Tiempo</i></div>
      <div class="chip"><b id="sRocks">0</b><i>Rocas</i></div>
      <div class="chip"><b id="sBlank">0</b><i>En vacío</i></div>
      <div class="chip"><b id="sColl">0</b><i>Colisiones</i></div>
      <div class="chip"><b id="sObl">0</b><i>Oblicuos</i></div>
      <div class="chip"><b id="sSmooth">—</b><i>Suavidad</i></div>
    </div>
    <div id="banner"></div>
    <div id="hint"></div>
  </div>

  <div id="rcol">
    <button class="tbtn" id="camBtn">CÁM 1 · Operador</button>
    <div id="gauges"></div>
    <button class="tbtn" id="faultBtn">Simular falla</button>
  </div>

  <div id="thumbs">
    <div class="thumb" data-slot="0"><span class="tlabel">CÁM 2</span><span class="trec">● REC</span></div>
    <div class="thumb" data-slot="1"><span class="tlabel">CÁM 3</span><span class="trec">● REC</span></div>
    <div class="thumb" data-slot="2"><span class="tlabel">CÁM 4</span><span class="trec">● REC</span></div>
  </div>

  <div id="toasts"></div>
  <div id="flash"></div>

  <div id="controls">
    <div class="pad">
      <div class="joy" id="joyL"><div class="knob"></div></div>
      <small>Giro ↔ · Brazo ↕</small>
    </div>
    <div id="mid">
      <button class="pbtn" id="hammer">GOLPEAR</button>
      <div class="row2">
        <button class="pbtn" id="start">START</button>
        <button class="pbtn" id="estop">E-STOP</button>
      </div>
    </div>
    <div class="pad">
      <div class="joy" id="joyR"><div class="knob"></div></div>
      <small>Martillo ↔ · Pluma ↕</small>
    </div>
  </div>

  <div id="overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const D2R = Math.PI/180;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* =====================================================
   PARÁMETROS (aproximados, a calibrar con datos del fabricante)
   ===================================================== */
const CFG = {
  L1:5.0, L2:4.2, L3:1.9,                      // largos: pluma, brazo, martillo (m)
  lim:{ phi:[-110*D2R,110*D2R], t2:[-5*D2R,85*D2R], t3:[-160*D2R,-15*D2R], t4:[-110*D2R,25*D2R] },
  vmax:{ phi:25*D2R, t2:18*D2R, t3:22*D2R, t4:30*D2R },   // rad/s a joystick completo
  tau:0.28,             // retardo hidráulico de la respuesta (s)
  strikeEvery:0.30,     // periodo de golpe (s)
  obliqueDeg:35,        // desviación máx. del martillo respecto de la vertical
  evalTime:150, faultAt:70, faultWindow:6,
  passScore:60, seed:20260919
};
const JN = ['phi','t2','t3','t4'];
const JLABEL = {phi:'Giro',t2:'Pluma',t3:'Brazo',t4:'Martillo'};
const J = {phi:0, t2:55*D2R, t3:-90*D2R, t4:-55*D2R};
const V = {phi:0, t2:0, t3:0, t4:0};

/* =====================================================
   ESCENA
   ===================================================== */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.xr.enabled = true;
const srgb = h => new THREE.Color(h).convertSRGBToLinear();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcdbfa4);
scene.fog = new THREE.Fog(srgb(0xcdbfa4), 45, 190);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
const rig = new THREE.Group(); scene.add(rig); rig.add(camera);   // en VR el rig sitúa al operador

scene.add(new THREE.HemisphereLight(srgb(0xcfe0ff), srgb(0x8a7a63), 0.85));
const sun = new THREE.DirectionalLight(srgb(0xfff1d8), 2.4);
sun.position.set(-9,15,8); sun.target.position.set(5,0,0); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});
scene.add(sun);

/* --- texturas procedurales (sin archivos externos) --- */
function canvasTex(w,h,draw,rx,ry,color){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); if(color!==false) t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; if(rx) t.repeat.set(rx,ry||rx);
  try{ t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); }catch(e){}
  return t;
}
function wrapDot(g,w,h,x,y,r){ for(const ox of [-w,0,w]) for(const oy of [-h,0,h]){ const px=x+ox, py=y+oy; if(px<-r||px>w+r||py<-r||py>h+r) continue; g.beginPath(); g.arc(px,py,r,0,6.2832); g.fill(); } }
const tr_=mulberry32(777);
const groundTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#8b7b64'; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){ const l=100+((tr_()*60)|0); g.fillStyle='rgba('+(l+30)+','+(l+10)+','+(l-20)+',0.10)'; wrapDot(g,w,h,tr_()*w,tr_()*h,20+tr_()*50); }
  for(let i=0;i<9000;i++){ const l=(60+tr_()*130)|0; g.fillStyle='rgba('+l+','+((l*0.9)|0)+','+((l*0.75)|0)+','+(0.25+tr_()*0.4)+')'; wrapDot(g,w,h,tr_()*w,tr_()*h,0.6+tr_()*1.8); }
},1/6,1/6);
function drawRock(g,w,h){
  g.fillStyle='#9a958c'; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){ g.fillStyle='rgba('+((90+tr_()*80)|0)+','+((85+tr_()*70)|0)+','+((80+tr_()*60)|0)+',0.35)'; wrapDot(g,w,h,tr_()*w,tr_()*h,8+tr_()*24); }
  for(let i=0;i<700;i++){ const l=(60+tr_()*150)|0; g.fillStyle='rgba('+l+','+l+','+((l*0.95)|0)+','+(0.25+tr_()*0.3)+')'; wrapDot(g,w,h,tr_()*w,tr_()*h,1.2+tr_()*2.6); }
  g.strokeStyle='rgba(30,28,26,0.5)'; g.lineWidth=2;
  for(let k=0;k<5;k++){ let x=tr_()*w,y=tr_()*h; g.beginPath(); g.moveTo(x,y); for(let q=0;q<9;q++){ x+=(tr_()-.5)*38; y+=(tr_()-.5)*38; g.lineTo(x,y); } g.stroke(); }
}
const rockTex=canvasTex(256,256,drawRock,1,1), rockBump=(function(){ const sv=tr_; return canvasTex(256,256,drawRock,1,1,false); })();
const wallTex=canvasTex(256,128,(g,w,h)=>{
  g.fillStyle='#8f9397'; g.fillRect(0,0,w,h);
  for(let i=0;i<3000;i++){ const l=(110+tr_()*70)|0; g.fillStyle='rgba('+l+','+l+','+(l+4)+','+(0.2+tr_()*0.35)+')'; wrapDot(g,w,h,tr_()*w,tr_()*h,0.6+tr_()*1.6); }
  for(let i=0;i<14;i++){ g.fillStyle='rgba(60,55,50,0.07)'; wrapDot(g,w,h,tr_()*w,tr_()*h,10+tr_()*30); }
  g.fillStyle='rgba(40,40,40,0.35)'; g.fillRect(0,h*0.5-1,w,2);
},1,1);
const hazardTex=canvasTex(128,128,(g,w,h)=>{
  g.fillStyle='#f2b705'; g.fillRect(0,0,w,h); g.fillStyle='#161616';
  for(let i=-h;i<w+h;i+=32){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+16,0); g.lineTo(i+16+h,h); g.lineTo(i+h,h); g.closePath(); g.fill(); }
},1,1);
const puffTex=canvasTex(64,64,(g,w,h)=>{
  const gr=g.createRadialGradient(32,32,2,32,32,30); gr.addColorStop(0,'rgba(225,210,180,0.95)'); gr.addColorStop(1,'rgba(225,210,180,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
},1,1);
puffTex.wrapS=puffTex.wrapT=THREE.ClampToEdgeWrapping;

const M = {
  yellow:new THREE.MeshStandardMaterial({color:srgb(0xf2b705),roughness:.5,metalness:.15}),
  yellowDk:new THREE.MeshStandardMaterial({color:srgb(0xc99400),roughness:.55,metalness:.2}),
  dark:new THREE.MeshStandardMaterial({color:srgb(0x2a2e33),roughness:.65,metalness:.35}),
  rubber:new THREE.MeshStandardMaterial({color:srgb(0x1a1c1e),roughness:.9,metalness:0}),
  steel:new THREE.MeshStandardMaterial({color:srgb(0xc9ced3),roughness:.3,metalness:.85}),
  concrete:new THREE.MeshStandardMaterial({color:srgb(0x8a8e92),roughness:.95}),
  ground:new THREE.MeshStandardMaterial({map:groundTex,color:srgb(0xc2b198),roughness:1}),
  pit:new THREE.MeshStandardMaterial({color:srgb(0x0e1114),roughness:1}),
  wall:new THREE.MeshStandardMaterial({map:wallTex,roughness:.9,metalness:.05}),
  grate:new THREE.MeshStandardMaterial({color:srgb(0x4a5158),roughness:.5,metalness:.7}),
  hazard:new THREE.MeshStandardMaterial({map:hazardTex,roughness:.7}),
  glass:new THREE.MeshStandardMaterial({color:srgb(0x22303a),roughness:.15,metalness:.5}),
  truckBed:new THREE.MeshStandardMaterial({color:srgb(0x7a828a),roughness:.7,metalness:.3})
};

const hyds = [];
function hyd(oa,pa,ob,pb){

const _a=new THREE.Vector3(), _b=new THREE.Vector3(), _d=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0), _q=new THREE.Quaternion();
function updHyd(){
  for(const h of hyds){
    _a.copy(h.pa); h.oa.localToWorld(_a); _b.copy(h.pb); h.ob.localToWorld(_b);
    _d.subVectors(_b,_a); const len=_d.length(); _d.normalize(); _q.setFromUnitVectors(_up,_d);
    h.body.quaternion.copy(_q); h.rod.quaternion.copy(_q);
    h.body.scale.y=len*0.55; h.body.position.copy(_a).addScaledVector(_d,len*0.275);
    h.rod.scale.y=len*0.45;  h.rod.position.copy(_a).addScaledVector(_d,len*0.775);
  }
}

}

/* mangueras flexibles que cruzan las articulaciones (curva de Bézier que se recalcula) */
const hoses=[], HSEG=8, _hc=new THREE.Vector3(), _p0=new THREE.Vector3(), _p1=new THREE.Vector3();
function joinHose(oa,pa,ob,pb,sag){
  const segs=[]; for(let i=0;i<HSEG;i++){ const m=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,6),M.rubber); scene.add(m); segs.push(m); }
  hoses.push({oa,pa:new THREE.Vector3(...pa),ob,pb:new THREE.Vector3(...pb),sag,segs});
}
[0.27,-0.27].forEach(z=>{
  joinHose(boomG,[4.6,0.30,z],stickG,[0.35,0.22,z],0.30);
  joinHose(stickG,[3.9,0.20,z],toolG,[0.15,0.32,z],0.25);
});
function bez(t,A,C,B,out){ const u=1-t; out.set(u*u*A.x+2*u*t*C.x+t*t*B.x, u*u*A.y+2*u*t*C.y+t*t*B.y, u*u*A.z+2*u*t*C.z+t*t*B.z); }
function updHoses(){
  for(const h of hoses){
    _a.copy(h.pa); h.oa.localToWorld(_a); _b.copy(h.pb); h.ob.localToWorld(_b);
    _hc.addVectors(_a,_b).multiplyScalar(0.5); _hc.y+=h.sag;
    for(let i=0;i<HSEG;i++){
      bez(i/HSEG,_a,_hc,_b,_p0); bez((i+1)/HSEG,_a,_hc,_b,_p1);
      _d.subVectors(_p1,_p0); const len=_d.length()||0.001; _d.normalize(); _q.setFromUnitVectors(_up,_d);
      const m=h.segs[i]; m.quaternion.copy(_q); m.scale.y=len; m.position.addVectors(_p0,_p1).multiplyScalar(0.5);
    }
  }
}
function applyPose(){
  slew.rotation.y=J.phi; boomG.rotation.z=J.t2; stickG.rotation.z=J.t3; toolG.rotation.z=J.t4;
  scene.updateMatrixWorld(true); updHyd(); updHoses();
}

let camIdx = 0;
const camP = new THREE.Vector3(), camT = new THREE.Vector3();
function viewGoal(i){
  const v=VIEWS[i], k=(camera.aspect<0.8)?1.55:1;
  const t=new THREE.Vector3(...v.t); const p=new THREE.Vector3(...v.p).sub(t).multiplyScalar(k).add(t);
  return {p,t};
}
function snapMainCam(){ const g=viewGoal(camIdx); camP.copy(g.p); camT.copy(g.t); camera.position.copy(camP); camera.lookAt(camT); }

/* --- cámaras fijas de sala de control (miniaturas, con corte instantáneo) --- */

let thumbEls=[], thumbRects=[], thumbLabelEls=[];

function applySlotViews(){

function layoutThumbs(){

  });

function renderThumbs(w,h){

let mode='train', machine='off';     // machine: off | ready | estop | nosignal
let session=null, rocks=[], frags=[], queue=[], qi=0;
let strikeAcc=0.22, blankT=0, collCool=0, hudT=0, muted=false;
const SLOTS=[[4.6,-0.4],[4.6,0.4],[6.4,-0.3],[6.4,0.3]];

function newSession(){
  return {active:mode==='train', ended:false, t:0, rocks:0, vacios:0, colis:0, obl:0, estops:0,
          react:null, faultDone:false, faultFail:false, faultAt:0, accSum:0, accN:0, log:[]};

function log(e){ if(session) session.log.push(session.t.toFixed(1)+' s  '+e); }

/* --- rocas --- */
function newSpec(rng){ return {r:0.38+rng()*0.27, jr:(rng()-0.5)*0.3, jp:(rng()-0.5)*0.15, sd:Math.floor(rng()*1e9)}; }
const ROCK_TINTS=[0xd2ccc0,0xbfb3a1,0xc9a28a,0xa3b7ad,0xdcd7cc];
function makeRockMaterial(x){
  let tint;
  if(x&&x.isColor) tint=x.clone();
  else { const k=Math.floor(x()*ROCK_TINTS.length); tint=srgb(ROCK_TINTS[k]).multiplyScalar(0.9+x()*0.2); }
  return new THREE.MeshStandardMaterial({map:rockTex,bumpMap:rockBump,bumpScale:0.5,color:tint,roughness:0.95,metalness:0.05,flatShading:true});
}
function spawnRock(spec,slot){
  const [sr,sp]=SLOTS[slot], rr=sr+spec.jr, ph=sp+spec.jp;
  const x=rr*Math.cos(ph), z=-rr*Math.sin(ph);
  const geo=new THREE.IcosahedronGeometry(1,2), rg=mulberry32(spec.sd);
  const a=rg()*6, b=rg()*6, c=rg()*6, pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const px=pos.getX(i),py=pos.getY(i),pz=pos.getZ(i);
    const s=1+0.17*(Math.sin(px*3.1+a)*Math.cos(py*2.7+b)+Math.sin(pz*3.7+c))+0.05*Math.sin(px*9+b)*Math.sin(py*8+c)*Math.sin(pz*7+a);
    pos.setXYZ(i,px*s,py*s*0.85,pz*s);
  }
  geo.computeVertexNormals();
  const mat=makeRockMaterial(rg);
  const mesh=new THREE.Mesh(geo,mat); mesh.castShadow=true; mesh.receiveShadow=true;
  const hp0=Math.ceil(spec.r*10)+2;
  const rock={mesh,slot,r:spec.r,hp:hp0,hp0,shake:0,base:new THREE.Vector3(x,spec.r*0.75+0.06,z)};
  mesh.position.copy(rock.base); mesh.scale.setScalar(spec.r); mesh.rotation.set(rg()*3.14,rg()*6.28,rg()*3.14);
  scene.add(mesh); rocks.push(rock); return rock;
}
function curR(r){ return r.r*(0.8+0.2*r.hp/r.hp0); }
function clearWorld(){
  for(const r of rocks){ scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); }
  for(const f of frags){ scene.remove(f.mesh); f.mesh.geometry.dispose(); }
  rocks=[]; frags=[];
}
function spawnInitialRocks(){
  if(mode==='eval'){
    const rng=mulberry32(CFG.seed); queue=[]; for(let i=0;i<14;i++) queue.push(newSpec(rng)); qi=0;
    for(let s=0;s<4;s++) spawnRock(queue[qi++],s);
  } else {
    queue=[]; qi=0;
    for(let s=0;s<4;s++) spawnRock(newSpec(Math.random),s);
  }
}
function resetWorld(){
  clearWorld();
  J.phi=0; J.t2=55*D2R; J.t3=-90*D2R; J.t4=-55*D2R; for(const k of JN) V[k]=0;
  machine='off'; strikeAcc=0.22; blankT=0; collCool=0;
  session=newSession(); applyPose();

/* =====================================================
   INTRODUCCIÓN: llegada del camión, descarga y polvo
   ===================================================== */
let introActive=false, introPending=true, introT=0, dumpRubbleDone=false;
const INTRO={driveIn:1.3, tiltUp:1.0, hold:0.9, tiltDown:1.0};
const PIT_C=new THREE.Vector3((GR.x0+GR.x1)/2,0.3,0);
const _easeIO = k => k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
function spawnDumpRubble(){
  const cx=(GR.x0+GR.x1)/2;
  for(let i=0;i<9;i++){
    const r=0.25+Math.random()*0.25;
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(r),makeRockMaterial(Math.random));
    m.castShadow=true; m.position.set(cx+(Math.random()-.5)*3.0, 4.6+Math.random()*1.2, (Math.random()-.5)*2.6);
    scene.add(m);
    frags.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*1.0,-0.3-Math.random()*0.6,(Math.random()-.5)*1.0),w:new THREE.Vector3(Math.random()*4,Math.random()*4,Math.random()*4)});
  }
}
function startIntro(){
  introPending=false; introActive=true; introT=0; dumpRubbleDone=false;
}
function updateIntro(dt){
  if(!introActive) return;
  introT+=dt;
  const a=INTRO.driveIn, b=a+INTRO.tiltUp, c=b+INTRO.hold, d=c+INTRO.tiltDown;
  if(introT<a){
    // el camión llega en reversa (retrocede hasta la posición de descarga)
    const k=_easeIO(clamp(introT/a,0,1));
    if(truckGrp) truckGrp.position.x=TRUCK_ENTER_X+(TRUCK_PARK_X-TRUCK_ENTER_X)*k;
    dustMat.opacity=0.12;
  } else if(introT<b){
    if(truckGrp) truckGrp.position.x=TRUCK_PARK_X;
    if(truckBed) truckBed.rotation.z=((introT-a)/INTRO.tiltUp)*0.6109;
    dustMat.opacity=0.12+((introT-a)/INTRO.tiltUp)*0.25;
  } else if(introT<c){
    if(truckBed) truckBed.rotation.z=0.6109;
    if(!dumpRubbleDone){ spawnDumpRubble(); dumpRubbleDone=true; if(truckLoad) truckLoad.visible=false; }
    const k=(introT-b)/INTRO.hold; dustMat.opacity=0.37+k*0.25;
    if(Math.random()<dt*6) spawnPuff(PIT_C,2,2.0,1.8);
  } else if(introT<d){
    const k=(introT-c)/INTRO.tiltDown;
    if(truckBed) truckBed.rotation.z=0.6109*(1-k);
    dustMat.opacity=0.62*(1-k)+0.12*k;
  } else {
    introActive=false; if(truckBed) truckBed.rotation.z=0; if(truckGrp) truckGrp.position.x=TRUCK_PARK_X; dustMat.opacity=0.12;
    spawnInitialRocks();
    machine='ready'; log('START'); toast('Mando habilitado','ok');
  }
}
function breakRock(rock){
  const p=rock.mesh.position.clone(), col=rock.mesh.material.color.clone();
  scene.remove(rock.mesh); rock.mesh.geometry.dispose(); rock.mesh.material.dispose();
  rocks.splice(rocks.indexOf(rock),1);
  for(let i=0;i<7;i++){
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(rock.r*(0.16+Math.random()*0.16)),makeRockMaterial(col));
    m.position.copy(p); m.castShadow=true; scene.add(m);
    frags.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*2.4,1+Math.random()*2.2,(Math.random()-.5)*2.4),w:new THREE.Vector3(Math.random()*6,Math.random()*6,Math.random()*6)});
  }
  spawnPuff(p,10,2.4,2.6);
  session.rocks++; log('roca fragmentada');
  toast('Roca fragmentada','ok'); sfx('break');
  if(mode==='eval'){
    if(qi<queue.length) spawnRock(queue[qi++],rock.slot);
    else if(rocks.length===0 && session.active) finishEval();
  } else spawnRock(newSpec(Math.random),rock.slot);
}

let AC=null;
function initAudio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,g,type){
  if(!AC||muted) return;
  try{ const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f*0.4),t+d);
    a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(a); a.connect(AC.destination); o.start(t); o.stop(t+d); }catch(e){}
}
function haptic(ms,int){
  try{ const xs=renderer.xr.getSession&&renderer.xr.getSession(); if(!xs) return;
    for(const src of xs.inputSources){ const g=src.gamepad; if(g&&g.hapticActuators&&g.hapticActuators[0]) g.hapticActuators[0].pulse(int,ms); } }catch(e){}
}
function sfx(k){
  if(k==='hit') haptic(35,0.5); else if(k==='break') haptic(130,1); else if(k==='coll') haptic(200,1);
  if(k==='hit') tone(150,.07,.10); else if(k==='break') tone(70,.28,.22,'sawtooth');
  else if(k==='coll') tone(55,.22,.22,'sawtooth'); else if(k==='stop') tone(520,.18,.10,'square');
  else if(k==='blank') tone(260,.06,.05);
}
let lastToast={msg:'',t:0,type:''};
function toast(msg,type){

  const box=$('toasts'); const d=document.createElement('div'); d.className='toast '+(type||''); d.textContent=msg; box.appendChild(d);
  while(box.children.length>3) box.removeChild(box.firstChild);

}

const keys=new Set();
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return; keys.add(e.code); initAudio();
  if(e.code==='Enter') pressStart();
  if(e.code==='KeyE') pressEstop();
  if(e.code==='KeyC') cycleCam();
  if(/^Digit[1-9]$/.test(e.code)){ const n=+e.code.slice(5)-1; if(n<VIEWS.length) setMainView(n); }
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>keys.clear());

function makeJoy(el){
  const knob=el.querySelector('.knob'), st={x:0,y:0,id:null};
  function set(e){
    const r=el.getBoundingClientRect(), R=r.width/2, lim=R*0.55;
    let dx=e.clientX-(r.left+R), dy=e.clientY-(r.top+R); const m=Math.hypot(dx,dy);
    if(m>lim){dx*=lim/m;dy*=lim/m;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)'; st.x=dx/lim; st.y=-dy/lim;
  }
  el.addEventListener('pointerdown',e=>{st.id=e.pointerId;try{el.setPointerCapture(e.pointerId);}catch(_){}set(e);initAudio();});
  el.addEventListener('pointermove',e=>{if(e.pointerId===st.id)set(e);});
  const end=e=>{if(e.pointerId===st.id){st.id=null;st.x=st.y=0;knob.style.transform='translate(0,0)';}};
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  return st;
}
const joyL=makeJoy($('joyL')), joyR=makeJoy($('joyR'));
let hammerBtn=false;
(function(){
  const h=$('hammer');
  h.addEventListener('pointerdown',e=>{hammerBtn=true;h.classList.add('on');try{h.setPointerCapture(e.pointerId);}catch(_){}initAudio();});
  const up=()=>{hammerBtn=false;h.classList.remove('on');};
  h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up);
})();
$('start').addEventListener('click',()=>{initAudio();pressStart();});
$('estop').addEventListener('pointerdown',()=>{initAudio();pressEstop();});

let gpPrev={};
function readInput(){
  const ax={phi:0,t2:0,t3:0,t4:0,hammer:false};
  const kd=c=>keys.has(c)?1:0;
  let sl=kd('KeyD')-kd('KeyA'), bo=kd('KeyW')-kd('KeyS'), st=kd('ArrowUp')-kd('ArrowDown'), to=kd('ArrowRight')-kd('ArrowLeft');
  sl+=joyL.x; bo+=joyL.y; to+=joyR.x; st+=joyR.y;
  let ham = keys.has('Space')||hammerBtn;
  try{
    const pads=navigator.getGamepads?navigator.getGamepads():[]; let gp=null; for(const p of pads){ if(p){gp=p;break;} }
    if(gp){
      const dz=v=>Math.abs(v)<0.12?0:v;
      sl+=dz(gp.axes[0]||0); bo+=-dz(gp.axes[1]||0); to+=dz(gp.axes[2]||0); st+=-dz(gp.axes[3]||0);
      const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
      if(b(7)||b(0)) ham=true;
      if(b(9)&&!gpPrev[9]) pressStart();
      if(b(1)&&!gpPrev[1]) pressEstop();
      gpPrev={9:b(9),1:b(1)};
    }
  }catch(e){}
  // controles Touch (Meta Quest) en sesión VR
  try{
    const xs=renderer.xr.getSession&&renderer.xr.getSession();
    if(xs){
      const dz=v=>Math.abs(v)<0.12?0:v;
      for(const src of xs.inputSources){
        const gp=src.gamepad; if(!gp) continue; const h=src.handedness;
        const sx=gp.axes.length>=4?gp.axes[2]:gp.axes[0], sy=gp.axes.length>=4?gp.axes[3]:gp.axes[1];
        if(h==='left'){ sl+=dz(sx||0); bo+=-dz(sy||0); } else if(h==='right'){ to+=dz(sx||0); st+=-dz(sy||0); }
        const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed), pv=xrPrev[h]||{};
        if(b(0)) ham=true;                                    // gatillo = golpear
        if(b(1)&&!pv[1]) pressEstop();                        // agarre = emergencia
        if(h==='right'){ if(b(4)&&!pv[4]) pressStart(); if(b(5)&&!pv[5]) pressEstop(); }
        if(h==='left'){ if(b(4)&&!pv[4]) cycleVRPos(); if(b(5)&&!pv[5]) setMode(mode==='train'?'eval':'train'); }
        xrPrev[h]={1:b(1),4:b(4),5:b(5)};
      }
    }
  }catch(e){}
  ax.phi=-clamp(sl,-1,1);          // derecha = giro horario (φ decrece)
  // Mapeo de mandos (pedido del cliente): bastón izquierdo ↕ = Brazo, bastón derecho ↕ = Pluma.
  // 'bo' = eje vertical izquierdo (W/S), 'st' = eje vertical derecho (↑/↓).
  ax.t2=clamp(st,-1,1); ax.t3=clamp(bo,-1,1); ax.t4=clamp(to,-1,1); ax.hammer=ham;
  return ax;
}
function locked(){ return $('overlay').style.display==='flex' && !renderer.xr.isPresenting; }

/* --- START / EMERGENCIA --- */
function pressStart(){
  if(renderer.xr.isPresenting && mode==='eval' && session && !session.active){ resetWorld(); session.active=true; hideOverlay(); return; }
  if(locked()||!session||!session.active) return;
  if(introActive){ toast('Espera a que el camión termine de descargar','warn'); return; }
  if(introPending){ startIntro(); toast('Camión ingresando en reversa…','ok'); return; }
  if(machine==='off'){ machine='ready'; toast('Mando habilitado','ok'); log('START'); }
  else if(machine==='estop') toast('Libera la emergencia primero (E-STOP)','warn');
  else if(machine==='nosignal') toast('Sin señal: presiona E-STOP','warn');
}
function pressEstop(){
  if(locked()||!session||!session.active) return;
  $('estop').classList.toggle('on', machine!=='estop');
  if(machine==='ready'||machine==='off'){
    machine='estop'; session.estops++; for(const k of JN) V[k]=0; log('parada de emergencia'); toast('EMERGENCIA activada','bad'); sfx('stop');
  } else if(machine==='nosignal'){
    session.react=session.t-session.faultAt; machine='estop'; session.estops++; for(const k of JN) V[k]=0;
    log('respuesta a falla en '+session.react.toFixed(1)+' s'); toast('Respuesta a la falla: '+session.react.toFixed(1)+' s','ok'); sfx('stop');
  } else if(machine==='estop'){
    machine='off'; toast('Emergencia liberada. Presiona START','ok');
  }
}
function triggerFault(){
  if(machine!=='ready') { toast('Habilita el mando (START) para simular la falla','warn'); return; }
  machine='nosignal'; session.faultDone=true; session.faultAt=session.t; for(const k of JN) V[k]=0; log('FALLA: pérdida de señal');
}

/* =====================================================
   FÍSICA / LÓGICA
   ===================================================== */
const _t=new THREE.Vector3();
function hitsSomething(){
  const list=[[tipObj,0.05],[toolMid,0.15],[toolG,0.4],[stickMid,0.4]];
  for(const [o,minY] of list){
    o.getWorldPosition(_t);
    if(_t.y<minY) return 'la parrilla o el piso';
    for(const w of WALLS){ if(_t.x>w.x0&&_t.x<w.x1&&_t.z>w.z0&&_t.z<w.z1&&_t.y<w.h) return 'la estructura'; }
  }
  return null;
}
function toolDev(){ const a3=J.t2+J.t3+J.t4; let d=a3+Math.PI/2; d=Math.atan2(Math.sin(d),Math.cos(d)); return Math.abs(d); }
function nearestRockGap(){
  tipObj.getWorldPosition(_t); let best=null, gap=1e9;
  for(const r of rocks){ const g=_t.distanceTo(r.mesh.position)-curR(r)*1.05; if(g<gap){gap=g;best=r;} }
  return {rock:best,gap};
}
function doStrike(){
  const {rock,gap}=nearestRockGap();
  if(rock && gap<0.15){
    blankT=0;
    if(toolDev()>CFG.obliqueDeg*D2R){ session.obl++; log('golpe oblicuo'); toast('Golpe oblicuo: apunta el martillo hacia abajo','warn'); sfx('blank'); }
    else { spawnPuff(_t,3,1.1,1.4); rock.hp--; rock.shake=0.16; sfx('hit'); if(rock.hp<=0) breakRock(rock); }
  } else {
    blankT+=CFG.strikeEvery; if(_t.y<0.7) spawnPuff(_t,1,0.7,0.8);
    if(blankT>=0.5){ blankT=0; session.vacios++; log('golpe en vacío'); toast('Golpe en vacío','bad'); sfx('blank'); }
  }
}
function smoothVal(){ return (session&&session.accN>30)?clamp(100-25*(session.accSum/session.accN),0,100):null; }
function computeScore(){
  const s=session, sm=smoothVal();
  let p=s.rocks*9 - s.vacios*5 - s.colis*8 - s.obl*3 + ((sm==null?70:sm)-70)*0.3;
  if(s.faultFail) p-=15; else if(s.react!==null) p+=Math.max(0,10-2*s.react);
  return Math.round(clamp(p,0,100));
}

const kk_cache={};
function step(dt){
  const ax=readInput();
  const isLocked=locked();
  updateIntro(dt);
  if(session.active && !isLocked && !introActive) session.t+=dt;

  if(mode==='eval' && session.active){
    if(!session.faultDone && session.t>=CFG.faultAt && machine==='ready') triggerFault();
    if(session.t>=CFG.evalTime) { finishEval(); }
  }
  if(machine==='nosignal' && session.t-session.faultAt>CFG.faultWindow){
    session.faultFail=true; machine='estop'; for(const k of JN) V[k]=0; log('sin respuesta a la falla'); toast('No respondiste a la falla a tiempo','bad');
  }

  const can = machine==='ready' && session.active && !isLocked;
  const kk=1-Math.exp(-dt/CFG.tau);
  const prev={phi:J.phi,t2:J.t2,t3:J.t3,t4:J.t4};
  let accSum=0, moving=false;
  for(const k of JN){
    const vOld=V[k];
    if(!can) V[k]=0; else V[k]+=(ax[k]*CFG.vmax[k]-V[k])*kk;
    J[k]+=V[k]*dt;
    const lim=CFG.lim[k];
    if(J[k]<lim[0]){J[k]=lim[0];V[k]=0;} else if(J[k]>lim[1]){J[k]=lim[1];V[k]=0;}
    if(can){ accSum+=Math.abs(V[k]-vOld)/dt/CFG.vmax[k]; if(Math.abs(ax[k])>0.05||Math.abs(V[k])>0.02*CFG.vmax[k]) moving=true; }
  }
  if(can&&moving){ session.accSum+=accSum/4; session.accN++; }
  applyPose();
  if(can){
    const hit=hitsSomething();
    if(hit){
      for(const k of JN){J[k]=prev[k];V[k]=0;} applyPose();
      if(collCool<=0){ session.colis++; collCool=0.8; log('colisión con '+hit); toast('Colisión con '+hit,'bad'); flash(); sfx('coll'); }
    }
  }
  collCool-=dt;

  // martillo
  if(can && ax.hammer){
    strikeAcc+=dt;
    if(strikeAcc>=CFG.strikeEvery){ strikeAcc-=CFG.strikeEvery; doStrike(); }
    chisel.position.x=1.2+0.07*Math.sin(performance.now()/1000*2*Math.PI*8);
  } else { strikeAcc=Math.max(strikeAcc,0.22); blankT=0; chisel.position.x=1.2; }
  dustMat.opacity+=((can&&ax.hammer?0.3:0.12)-dustMat.opacity)*Math.min(1,dt*3); updateDust(dt); updatePuffs(dt);

  // rocas y fragmentos
  const tnow=performance.now()/1000;
  beacon.material.emissiveIntensity = machine==='ready' ? (Math.sin(tnow*8)>0?1.6:0.1) : 0;
  for(const r of rocks){
    r.shake=Math.max(0,r.shake-dt);
    const sh=r.shake*0.35;
    r.mesh.position.set(r.base.x+(Math.random()-.5)*sh,r.base.y,r.base.z+(Math.random()-.5)*sh);
    r.mesh.scale.setScalar(curR(r));
    r.mesh.material.emissive.setHex(0x000000);
  }
  for(let i=frags.length-1;i>=0;i--){
    const f=frags[i]; f.v.y-=9.8*dt; f.mesh.position.addScaledVector(f.v,dt);
    f.mesh.rotation.x+=f.w.x*dt; f.mesh.rotation.y+=f.w.y*dt;
    if(f.mesh.position.y<-1.1){ scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); frags.splice(i,1); }
  }

  // ayudas de formación
  const aid = (mode==='train');
  ring.visible=aid; arrow.visible=aid&&rocks.length>0;
  if(aid){
    tipObj.getWorldPosition(_t); ring.position.set(_t.x,0.09,_t.z);
    if(rocks.length){ const tg=rocks[0]; tg.mesh.material.emissive.setHex(0x3a2c00); const pl=0.5+0.5*Math.sin(tnow*4); tg.mesh.material.emissive.setRGB(0.25*pl,0.18*pl,0);
      arrow.position.set(tg.base.x,tg.base.y+curR(tg)+0.9+0.15*Math.sin(tnow*3),tg.base.z); }
  }

  // cámara (en VR la posee el visor)
  if(!renderer.xr.isPresenting){
    const g=viewGoal(camIdx), ck=1-Math.exp(-dt*4);
    camP.lerp(g.p,ck); camT.lerp(g.t,ck); camera.position.copy(camP); camera.lookAt(camT);
  }

  hudT+=dt; if(hudT>0.1){ hudT=0; hud(); }
}

const gaugeEl=$('gauges');
JN.forEach(k=>{ const d=document.createElement('div'); d.className='g'; d.id='g_'+k; d.innerHTML='<div class="bar"><u></u></div><span>'+JLABEL[k]+'</span>'; gaugeEl.appendChild(d); });
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function hud(){
  const names={off:'APAGADO',ready:'HABILITADO',estop:'EMERGENCIA',nosignal:'SIN SEÑAL'};
  $('sState').textContent=names[machine]; $('cState').dataset.s=machine;
  if(mode==='eval'){ $('sTime').textContent=fmt(CFG.evalTime-session.t); $('sTimeL').textContent='Restante'; }
  else { $('sTime').textContent=fmt(session.t); $('sTimeL').textContent='Práctica'; }
  $('sRocks').textContent=session.rocks; $('sBlank').textContent=session.vacios; $('sColl').textContent=session.colis; $('sObl').textContent=session.obl;
  const sm=smoothVal(); $('sSmooth').textContent=sm==null?'—':Math.round(sm);
  $('sMode').textContent=(mode==='eval')?'Evaluación':'Formación';
  $('estop').classList.toggle('on',machine==='estop');
  $('start').disabled=introActive;

  const tr=(mode==='train'); hintText='';
  gaugeEl.style.display=tr?'flex':'none'; $('hint').style.display=tr?'block':'none'; $('faultBtn').style.display=tr?'':'none';
  if(tr){
    for(const k of JN){ const [a,b]=CFG.lim[k], f=(J[k]-a)/(b-a); const el=$('g_'+k);
      el.querySelector('u').style.bottom=(f*100)+'%'; el.classList.toggle('lim',f<0.05||f>0.95); }
    let h;
    if(introActive) h='Camión descargando roca en la parrilla… espera a que se despeje el polvo.';
    else if(introPending) h='Presiona START para que el camión ingrese en reversa y descargue.';
    else if(machine==='off') h='Presiona START para habilitar el mando.';
    else if(machine==='estop') h='Emergencia activa. Libérala (E-STOP) y luego presiona START.';
    else if(machine==='nosignal') h='Sin señal del radiocontrol. Presiona E-STOP de inmediato.';
    else {
      const {rock,gap}=nearestRockGap();
      if(!rock) h='Sin rocas en la parrilla.';
      else if(gap>0.15) h='Lleva la punta hasta la roca marcada. El anillo amarillo muestra dónde está la punta sobre el piso.';
      else if(toolDev()>CFG.obliqueDeg*D2R) h='Endereza el martillo: debe quedar casi vertical sobre la roca.';
      else h='Mantén GOLPEAR. Golpes restantes en esta roca: '+rock.hp+'.';
    }
    $('hint').textContent=h; hintText=h;
  }
  const b=$('banner');
  if(introActive){ b.style.display='block'; b.className=''; b.textContent='CAMIÓN DESCARGANDO — espere'; }
  else if(machine==='nosignal'){ b.style.display='block'; b.className='warn'; b.textContent='PÉRDIDA DE SEÑAL: presiona E-STOP'; }
  else if(machine==='estop'){ b.style.display='block'; b.className=''; b.textContent='EMERGENCIA ACTIVA: libera y presiona START'; }
  else b.style.display='none';
  if(renderer.xr.isPresenting) drawVRPanel();
}

   '<div class="big '+(ok?'pass':'fail')+'">'+sc+' / 100</div>'+
   '<p><b class="'+(ok?'pass':'fail')+'">'+(ok?'Sobre':'Bajo')+' el umbral provisorio ('+CFG.passScore+')</b></p>'+
   '<table><tr><td>Rocas fragmentadas</td><td>'+session.rocks+'</td></tr>'+
   '<tr><td>Golpes en vacío</td><td>'+session.vacios+'</td></tr>'+
   '<tr><td>Colisiones</td><td>'+session.colis+'</td></tr>'+
   '<tr><td>Golpes oblicuos</td><td>'+session.obl+'</td></tr>'+
   '<tr><td>Suavidad (preliminar)</td><td>'+(sm==null?'—':Math.round(sm))+'</td></tr>'+
   '<tr><td>Respuesta a la falla</td><td>'+fault+'</td></tr>'+
   '<tr><td>Usos de emergencia</td><td>'+session.estops+'</td></tr></table>'+
   '<h3>Registro (últimos eventos)</h3><pre>'+(logTxt||'sin eventos')+'</pre>'+
   '<p class="small">Fórmula provisoria: 9/roca − 5/vacío − 8/colisión − 3/oblicuo + ajuste de suavidad + bono por reacción rápida − 15 si no responde a la falla.</p>'+
   '<button class="cta" data-act="startEval">Repetir prueba</button> <button class="cta alt" data-act="toTrain">Ir a formación</button>');
}
ov.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='close') hideOverlay();
  else if(act==='startEval'){ resetWorld(); session.active=true; hideOverlay(); }
  else if(act==='toTrain') setMode('train');
  else if(act==='startTrain'){ initAudio(); setMode('train'); showOverlay(HELP); }
  else if(act==='startEvalMode'){ initAudio(); setMode('eval'); }
});
function setMode(m){
  mode=m; document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  resetWorld(); $('estop').classList.remove('on');
  if(m==='eval') evalIntro(); else hideOverlay();
  $('faultBtn').style.display=(m==='train')?'':'none'; hud();
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{initAudio();setMode(b.dataset.m);}));
function cycleCam(){ setMainView((camIdx+1)%VIEWS.length); }
$('camBtn').addEventListener('click',cycleCam);
$('sndBtn').addEventListener('click',()=>{ muted=!muted; $('sndBtn').textContent='Sonido: '+(muted?'no':'sí'); initAudio(); });
$('helpBtn').addEventListener('click',()=>showOverlay(HELP));
$('faultBtn').addEventListener('click',()=>{ initAudio(); if(session.active) triggerFault(); });
/* menú de configuración */
const cfgMenu=$('cfgMenu');
$('cfgBtn').addEventListener('click',e=>{ e.stopPropagation(); const open=cfgMenu.style.display!=='flex'; cfgMenu.style.display=open?'flex':'none'; $('cfgBtn').setAttribute('aria-expanded',open?'true':'false'); });
cfgMenu.addEventListener('click',e=>{ if(e.target.closest('button')){ cfgMenu.style.display='none'; $('cfgBtn').setAttribute('aria-expanded','false'); } });
document.addEventListener('pointerdown',e=>{ if(!$('cfgWrap').contains(e.target)){ cfgMenu.style.display='none'; $('cfgBtn').setAttribute('aria-expanded','false'); } });
/* joysticks en pantalla: ocultables cuando se usa un joystick físico */
let joysOff=false; try{ joysOff=localStorage.getItem('sim_joys_off')==='1'; }catch(e){}
function applyJoys(){ document.querySelectorAll('.pad').forEach(el=>{ el.style.display=joysOff?'none':''; }); $('joyBtn').textContent='Joysticks en pantalla: '+(joysOff?'ocultos':'visibles'); }
$('joyBtn').addEventListener('click',()=>{ joysOff=!joysOff; applyJoys(); try{ localStorage.setItem('sim_joys_off',joysOff?'1':'0'); }catch(e){} });
applyJoys();

/* =====================================================
   ARRANQUE
   ===================================================== */
/* =====================================================
   REALIDAD VIRTUAL (WebXR · Meta Quest)
   ===================================================== */
let hintText='';
const xrPrev={};
const VR_POS=[
  {p:[4.5,0,10.3],n:'vista general'},
  {p:[4.5,0,6.8],n:'junto al pozo'},
  {p:[7.0,0,6.8],n:'lado martillo'},
  {p:[2.5,0,6.8],n:'lado giro'}
];
let vrPosIdx=0;
const vrCanvas=document.createElement('canvas'); vrCanvas.width=640; vrCanvas.height=360;
const vrCtx=vrCanvas.getContext('2d');
const vrTex=new THREE.CanvasTexture(vrCanvas);
const vrPanel=new THREE.Mesh(new THREE.PlaneGeometry(1.28,0.72),new THREE.MeshBasicMaterial({map:vrTex,transparent:true}));
vrPanel.position.set(-0.75,1.25,-1.5); vrPanel.rotation.y=0.4; vrPanel.visible=false; rig.add(vrPanel);
function cycleVRPos(){ vrPosIdx=(vrPosIdx+1)%VR_POS.length; if(renderer.xr.isPresenting) rig.position.set(...VR_POS[vrPosIdx].p); }

/* --- Sala de mando remota (control room), 5º punto de teletransporte ---
   Pared de monitores con el feed EN VIVO de las 8 cámaras ya definidas en VIEWS
   (render-to-texture). Solo se actualizan mientras el operador está parado
   en este punto y dentro de la sesión VR, para no gastar GPU de más. */
const roomX=-10, roomZ=4, wallZ=roomZ-2;
VR_POS.push({p:[roomX,0,roomZ], n:'sala de mando'});
const ROOM_IDX = VR_POS.length-1;
const monitorCams=[], monitorRTs=[];
(function buildControlRoom(){
  const M_bezel=new THREE.MeshStandardMaterial({color:srgb(0x15181b),roughness:.6,metalness:.25});
  const M_frame=new THREE.MeshStandardMaterial({color:srgb(0x2a2f34),roughness:.5,metalness:.4});
  scene.add(box(3.1,2.15,0.08,M_frame,roomX,1.8,wallZ-0.05));          // pared de fondo
  scene.add(box(2.2,0.06,0.7,M_frame,roomX,0.72,roomZ-0.9));           // tablero del escritorio
  scene.add(box(2.2,0.7,0.05,M_bezel,roomX,0.36,roomZ-1.22));          // frente del mueble
  const screenW=0.5, screenH=0.3, gapX=0.09, gapY=0.09, cols=4, rows=2;
  const totalW=cols*screenW+(cols-1)*gapX;
  for(let i=0;i<cols*rows;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const x=roomX-totalW/2+screenW/2+col*(screenW+gapX);
    const y=2.1-row*(screenH+gapY);
    scene.add(box(screenW+0.06,screenH+0.06,0.04,M_bezel,x,y,wallZ-0.01));
    const rt=new THREE.WebGLRenderTarget(480,300,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
    monitorRTs.push(rt);
    const v=VIEWS[i%VIEWS.length];
    const cam=new THREE.PerspectiveCamera(50,480/300,0.1,220);
    cam.position.set(...v.p); cam.lookAt(...v.t);
    monitorCams.push(cam);
    const screen=new THREE.Mesh(new THREE.PlaneGeometry(screenW,screenH), new THREE.MeshBasicMaterial({map:rt.texture,toneMapped:false}));
    screen.position.set(x,y,wallZ+0.015);
    scene.add(screen);
  }
})();
let monitorFrame=0;
function updateControlRoomScreens(){
  const batch=2;    // se refrescan 2 de los 8 monitores por frame (ciclo completo ≈4 frames)
  // mientras xr.enabled=true, renderer.render() sustituye SIEMPRE la cámara que le pasamos
  // por la del propio casco (xr.getCamera). Hay que apagarlo durante estas pasadas, igual
  // que hace THREE.CubeCamera cuando renderiza a textura dentro de una sesión XR.
  const xrWasEnabled=renderer.xr.enabled;
  renderer.xr.enabled=false;
  for(let k=0;k<batch;k++){
    const i=(monitorFrame+k)%monitorCams.length;
    renderer.setRenderTarget(monitorRTs[i]);
    renderer.render(scene,monitorCams[i]);
  }
  renderer.xr.enabled=xrWasEnabled;
  monitorFrame=(monitorFrame+batch)%monitorCams.length;
  renderer.setRenderTarget(null);
}
function wrapText(c,text,x,y,maxW,lh){
  const words=text.split(' '); let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(c.measureText(t).width>maxW&&line){ c.fillText(line,x,y); line=w; y+=lh; } else line=t; }
  if(line){ c.fillText(line,x,y); y+=lh; } return y;
}
function drawVRPanel(){
  const c=vrCtx, W=640, H=360;
  c.fillStyle='rgba(18,20,23,0.92)'; c.fillRect(0,0,W,H);
  c.strokeStyle='#f2b705'; c.lineWidth=6; c.strokeRect(3,3,W-6,H-6);
  const names={off:'APAGADO',ready:'HABILITADO',estop:'EMERGENCIA',nosignal:'SIN SEÑAL'};
  const col={off:'#c4cad0',ready:'#3ddc84',estop:'#ff4d4d',nosignal:'#ff9f1c'};
  c.textBaseline='top'; c.textAlign='left';
  c.font='bold 40px sans-serif'; c.fillStyle=col[machine]; c.fillText(names[machine],20,16);
  c.textAlign='right'; c.fillStyle='#ffffff';
  c.fillText(mode==='eval'?fmt(CFG.evalTime-session.t):fmt(session.t),W-20,16);
  c.textAlign='left'; c.font='bold 26px sans-serif'; c.fillStyle='#f2f3f4';
  c.fillText('Rocas '+session.rocks+'   Vacío '+session.vacios+'   Colis. '+session.colis+'   Obl. '+session.obl,20,70);
  c.font='24px sans-serif';
  let msg='', mc='#f2f3f4';
  if(mode==='eval'&&session.ended) msg='RESULTADO: '+computeScore()+' / 100 (provisorio). A: repetir. Y: formación.';
  else if(mode==='eval'&&!session.active) msg='PRUEBA ESTÁNDAR de 150 s. Presiona A para iniciar. Y: volver a formación.';
  else if(machine==='nosignal'){ msg='PÉRDIDA DE SEÑAL: presiona EMERGENCIA (B o agarre).'; mc='#ffb020'; }
  else if(machine==='estop'){ msg='Emergencia activa. Libérala (B o agarre) y luego START (A).'; mc='#ff8080'; }
  else if(machine==='off') msg='Presiona A (START) para habilitar el mando.';
  else msg=hintText;
  c.fillStyle=mc; wrapText(c,msg,20,116,W-40,30);
  if(performance.now()-lastToast.t<3000){
    c.fillStyle=lastToast.type==='bad'?'#ff6b6b':(lastToast.type==='ok'?'#4be08f':'#ffd166');
    c.font='bold 26px sans-serif'; c.fillText(lastToast.msg,20,240);
  }
  c.font='17px sans-serif'; c.fillStyle='#9aa3ab';
  c.fillText('Sticks: mover · Gatillo: golpear · A: START · B/agarre: EMERGENCIA',20,H-62);
  c.fillText('X: posición ('+VR_POS[vrPosIdx].n+') · Y: modo ('+(mode==='train'?'formación':'evaluación')+')',20,H-36);
  vrTex.needsUpdate=true;
}
const vrDiag={sup:undefined};
function diagText(){
  let top=false; try{ top=(window.top!==window); }catch(e){ top=true; }
  return 'Diagnóstico: contexto seguro (HTTPS) = '+(window.isSecureContext?'sí':'NO')+' · WebXR disponible = '+(navigator.xr?'sí':'NO')+' · VR inmersiva admitida = '+(vrDiag.sup===undefined?'sin probar':(vrDiag.sup?'sí':'NO'))+' · dentro de otra página = '+(top?'sí':'no')+'.';
}
function vrMsg(msg){
  showOverlay('<h2>Realidad virtual</h2><p>'+msg+'</p><p class="small">'+diagText()+'</p><p class="small">Requiere un visor con WebXR (Meta Quest) y abrir la página desde su navegador. Si el diagnóstico dice que no hay HTTPS, hay que alojar el HTML en un servidor con HTTPS (GitHub Pages, Vercel o Netlify).</p><button class="cta" data-act="close">Cerrar</button>');
}
function onVRStart(){
  rig.position.set(...VR_POS[vrPosIdx].p); vrPanel.visible=true; sun.castShadow=false;
  $('vrBtn').textContent='Salir de VR'; drawVRPanel();
}
function onVREnd(){
  rig.position.set(0,0,0); rig.rotation.set(0,0,0); vrPanel.visible=false; sun.castShadow=true;
  $('vrBtn').textContent='Entrar en VR'; resize();
  if(mode==='eval'&&!session.active&&!session.ended) evalIntro();
}
async function enterVR(){
  if(renderer.xr.isPresenting){ const cur=renderer.xr.getSession(); if(cur) cur.end(); return; }
  if(!window.isSecureContext){ vrMsg('Esta página no está en un contexto seguro (HTTPS). WebXR no funciona si el HTML se abre como archivo (file://) o por HTTP.'); return; }
  if(!navigator.xr){ vrMsg('Este navegador no ofrece WebXR. Ábrela con el navegador de la Quest.'); return; }
  try{
    const ok=await navigator.xr.isSessionSupported('immersive-vr');
    vrDiag.sup=ok;
    if(!ok){ vrMsg('Este dispositivo o navegador no admite sesiones de realidad virtual.'); return; }
    const xrs=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    xrs.addEventListener('end',onVREnd);
    await renderer.xr.setSession(xrs);
    onVRStart();
  }catch(err){ vrMsg('No se pudo iniciar la sesión de VR ('+(err&&err.name?err.name+': ':'')+(err&&err.message?err.message:'error')+').'); }
}
$('vrBtn').addEventListener('click',()=>{ initAudio(); enterVR(); });

resize();
applySlotViews();
resetWorld(); hud();
showOverlay(START_CARD,'start');
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  try{ step(dt); }catch(err){ console.error(err); }
  if(renderer.xr.isPresenting && vrPosIdx===ROOM_IDX){
    try{ updateControlRoomScreens(); }catch(err){ console.error(err); }
  }
  renderer.render(scene,camera);
  if(!renderer.xr.isPresenting){
    try{ renderThumbs(renderer.domElement.clientWidth||$('app').clientWidth, renderer.domElement.clientHeight||$('app').clientHeight); }catch(err){ console.error(err); }
  }
}
renderer.setAnimationLoop(loop);
})();
</script>
